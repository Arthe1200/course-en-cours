<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Course en Cours — Espace projet</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="loginView" class="login-shell">
  <div class="login-card">
    <div class="brand-mark">🏎️</div>
    <span class="eyebrow">COURSE EN COURS</span>
    <h1>Carnet de bord du projet</h1>
    <p>Connecte-toi avec les identifiants qui t'ont été attribués.</p>
    <form id="loginForm">
      <label>Identifiant<input id="username" autocomplete="username" required></label>
      <label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="button primary" type="submit">Se connecter</button>
      <p id="loginError" class="error" hidden></p>
    </form>
  </div>
</div>
<div id="teamPicker" class="team-picker-shell" hidden></div>
<div id="appView" hidden>
<header class="topbar">
  <div class="brand"><div class="logo">🏎️</div><div><span>COURSE EN COURS</span><h1>Espace projet</h1></div></div>
  <div class="top-actions"><span id="identity" class="identity"></span><button id="profileBtn" class="ghost" hidden>Profil</button><button id="logoutBtn" class="ghost">Déconnexion</button></div>
</header>
<div class="layout">
<aside class="sidebar">
<nav>
<button class="nav active" data-page="accueil">🏠 <span>Accueil</span></button>
<button class="nav" data-page="progression">📊 <span>Progression</span></button>
<button class="nav" data-page="equipes">👥 <span>Équipes</span></button>
<button class="nav" data-page="taches">🗂️ <span>Tâches</span></button>
<button class="nav" data-page="journal">📅 <span>Journal des élèves</span></button>
<button class="nav" data-page="journal-ia">📘 <span>Journal de bord (IA)</span></button>
<button id="aiNav" class="nav" data-page="ia" hidden>🤖 <span>Assistant IA</span></button>
<button class="nav" data-page="annotations">💬 <span>Annotations</span></button>
<button class="nav" data-page="problemes">⚠️ <span>Problèmes</span></button>
<button class="nav" data-page="idees">💡 <span>Idées</span></button>
<button class="nav" data-page="tests">🧪 <span>Tests</span></button>
<button id="leaderNav" class="nav" data-page="chef" hidden>🔒 <span>Espace privé du chef</span></button>
<button id="adminNav" class="nav" data-page="admin" hidden>⚙️ <span>Administration</span></button>
</nav>
<div class="side-bottom"><div class="mini">🔐 <div><b>Compte connecté</b><small>Permissions selon ton compte</small></div></div><a class="github" href="https://github.com/Arthe1200/course-en-cours" target="_blank">Ouvrir GitHub ↗</a></div>
</aside>
<main><section id="page"></section></main>
</div>
</div>
<script src="config.js?v=2"></script><script src="app.js?v=10"></script>
</body></html>
