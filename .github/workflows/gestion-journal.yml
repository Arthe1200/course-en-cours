name: 📚 Automatisation du carnet de bord

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  creer-journee:
    name: Créer la journée
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'Nouvelle séance')
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Enregistrer le contenu de la séance
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s\n' "$ISSUE_BODY" > seance_issue.md

      - name: Générer la journée et les historiques
        run: python scripts/gestion_journal.py

      - name: Publier les fichiers
        run: |
          git config user.name "course-en-cours-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOURNEES SUIVI
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "chore: créer la séance du carnet de bord [skip ci]"
            git push
          fi

      - name: Fermer automatiquement l'issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}"             --comment "✅ Séance enregistrée automatiquement dans JOURNEES/. Les historiques SUIVI/ ont été mis à jour."

  verification-manuelle:
    name: Vérification manuelle
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ L'automatisation est disponible. Les nouvelles Issues « Nouvelle séance » déclenchent automatiquement le carnet de bord."
