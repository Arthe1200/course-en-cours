name: Deploy Course en Cours Auth

on:
  push:
    branches: ["main"]
    paths:
      - "AUTH/**"
      - ".github/workflows/deploy-auth.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Restore GroqCloud API secret
        working-directory: AUTH
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "Le secret GROQ_API_KEY est absent de GitHub. Ajoute-le dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$GROQ_API_KEY" | wrangler secret put GROQ_API_KEY

      - name: Apply D1 schema
        working-directory: AUTH
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute course-en-cours --remote --file=schema.sql

      - name: Deploy Worker
        working-directory: AUTH
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
