name: Déployer l'interface Course en Cours

on:
  push:
    branches: ["main"]
    paths:
      - "INTERFACE/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -R INTERFACE/. _site/

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Créer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
